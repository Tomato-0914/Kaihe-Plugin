# ==================== 群友开盒 配置 ====================
# 首次加载会自动复制为 config.yaml，请修改 config.yaml（改完即时生效，无需重启）

# 启用的群号，留空 [] 表示所有群，例：[123456, 654321]
groups: []

# 发送图片时是否引用触发消息
quote: false

# 渲染缩放：1 = 760px 宽；1.5 更清晰，图片体积稍大
scale: 1.5

# 版面主题：default 经典黄底黑字 / gold 黑底金字 / dossier 机密卷宗 / blueprint 蓝图档案
#          cyber 赛博终端 / ink 水墨宣纸 / sakura 粉色手帐 / midnight 深夜模式
# 可在 resources/gazette/themes/ 放入新的 css 文件自定义主题（文件名即主题名）
theme: default

# 主题切换方式：fixed 固定使用上面的 theme / rotate 按顺序轮换 / random 每次随机
# 也可由主人发送 #开盒主题 查看与切换
themeMode: fixed

# 参与轮换 / 随机的主题，留空 [] 表示全部主题，例：[gold, cyber, dossier]
themePool: []

# 时区（决定日期、作息统计）
timezone: Asia/Shanghai

# 群聊取样：本群最近多少条消息（用于群聊占比、AI 了解话题氛围）
sampleSize: 150

# 本人取样：向前翻页，直到取到该成员最近多少条消息（发言构成、作息统计用）
userSample: 100

# 回溯深度：每页 100 条，最多往前翻多少页；翻到的记录按群缓存复用（深度上限为 maxPages × 100 与 record.historyMax 的较小值），
# 同群再次开盒通常只需补拉 1 页最新消息
maxPages: 30

record:
  # 本地为每位成员保留最近多少条发言记录（作息 / 构成统计用）
  userMax: 300
  # 本地为每个群保留最近多少条消息（接口拉历史失败时兜底）
  groupMax: 300
  # 每个群在 Redis 中缓存的历史消息上限（翻页结果复用，7 天未使用自动过期）
  historyMax: 3000
  # 记录保留天数（按最后一次写入顺延）
  keepDays: 30

avatar:
  # 追踪头像变更（比对头像指纹；成员发言时按间隔检测）
  enable: true
  intervalHours: 6

ai:
  # 开启后需填写 apiKey；未填或调用失败时自动使用内置模板文案
  enable: true
  # OpenAI 兼容接口，需包含 /v1（DeepSeek / 通义 / Kimi / OpenAI / 中转站 均可）
  baseURL: https://api.deepseek.com/v1
  apiKey: ""
  # 填模型 id（非显示名），DeepSeek 可选 deepseek-flash / deepseek-v4-pro
  model: deepseek-flash
  temperature: 0.9
  # 请求超时（秒）
  timeout: 45
  # 喂给 AI 的群聊上下文条数 / 本人发言条数
  contextSize: 80
  userSize: 40
  # 同一成员 AI 稿件缓存（分钟），0 为不缓存
  cacheMinutes: 30
